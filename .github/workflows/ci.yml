name: Compose smoketest

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Smoke .env.example
        run: cp .env.example .env

      - name: docker compose config (CPU)
        run: docker compose --env-file .env -f compose.yaml config -q

      - name: docker compose config (GPU)
        run: docker compose --env-file .env -f compose.yaml -f compose.gpu.yaml config -q

      - name: install.sh shellcheck (best-effort)
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck install.sh || true
